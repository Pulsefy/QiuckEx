<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Active marketplace listing detail</title>
  <desc id="desc">Wireframe screenshot for an active listing with bid history and enabled actions.</desc>
  <rect width="1280" height="720" fill="#0a0a0a"/>
  <rect x="80" y="60" width="1120" height="600" rx="32" fill="#111827" stroke="#374151"/>
  <text x="120" y="120" fill="#818cf8" font-family="system-ui,sans-serif" font-size="14" font-weight="700">LISTING DETAIL</text>
  <text x="120" y="170" fill="#f9fafb" font-family="system-ui,sans-serif" font-size="42" font-weight="900">@nova</text>
  <rect x="120" y="210" width="320" height="120" rx="24" fill="#1f2937" stroke="#374151"/>
  <text x="150" y="245" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="12" font-weight="700">CURRENT HIGH BID</text>
  <text x="150" y="290" fill="#f9fafb" font-family="system-ui,sans-serif" font-size="28" font-weight="900">150 USDC</text>
