  <rect x="120" y="360" width="670" height="220" rx="24" fill="#111827" stroke="#374151"/>
  <text x="150" y="395" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="12" font-weight="700">BID HISTORY</text>
  <rect x="150" y="420" width="590" height="48" rx="16" fill="#1f2937" stroke="#374151"/>
  <text x="170" y="450" fill="#f9fafb" font-family="system-ui,sans-serif" font-size="16" font-weight="700">150 USDC · GBID...ID12</text>
  <rect x="820" y="210" width="340" height="370" rx="24" fill="#1f2937" stroke="#374151"/>
  <rect x="850" y="500" width="280" height="52" rx="16" fill="#6366f1"/>
  <text x="930" y="532" fill="#ffffff" font-family="system-ui,sans-serif" font-size="16" font-weight="800">Continue to bid</text>
