<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Unavailable marketplace listing detail</title>
  <desc id="desc">Wireframe screenshot for a sold or missing listing with fallback messaging.</desc>
  <rect width="1280" height="720" fill="#0a0a0a"/>
  <rect x="80" y="60" width="1120" height="600" rx="32" fill="#111827" stroke="#374151"/>
  <text x="120" y="120" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="14" font-weight="700">UNAVAILABLE</text>
  <text x="120" y="170" fill="#f9fafb" font-family="system-ui,sans-serif" font-size="42" font-weight="900">Listing not found</text>
  <text x="120" y="220" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="18">This listing may have been removed or the link is no longer valid.</text>
  <rect x="120" y="280" width="520" height="96" rx="24" fill="#422006" stroke="#92400e"/>
  <text x="150" y="320" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Listing unavailable</text>
  <text x="150" y="350" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="14">This listing has been sold.</text>
  <rect x="120" y="420" width="180" height="48" rx="16" fill="#1f2937" stroke="#374151"/>
  <text x="165" y="450" fill="#f9fafb" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Close</text>
</svg>
