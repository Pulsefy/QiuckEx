# ─────────────────────────────────────────────────────────────────────────────
# Secret Scanning Workflow
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push and pull request to detect accidental secret leaks.
# Uses two complementary scanners:
#   1. detect-secrets  – Yelp's pattern-based scanner with a baseline file
#   2. gitleaks         – broad regex-based scanner covering 130+ providers
#
# Both tools run in "verify" mode so that any NEW secret introduced in a
# commit will fail the CI check and block merging.
# ─────────────────────────────────────────────────────────────────────────────

name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  # Required for gitleaks to post PR annotations
  pull-requests: write

jobs:
  # ── detect-secrets ────────────────────────────────────────────────────────
  detect-secrets:
    name: detect-secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can diff against the base branch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          # If a baseline exists, audit against it; otherwise do a fresh scan.
          if [ -f .secrets.baseline ]; then
            echo "Using existing baseline for verification..."
            detect-secrets scan \
              --baseline .secrets.baseline \
              --exclude-files '(pnpm-lock\.yaml|package-lock\.json|.*\.lock|node_modules/.*|dist/.*|coverage/.*)' \
              .
          else
            echo "No baseline found – running fresh scan..."
            detect-secrets scan \
              --exclude-files '(pnpm-lock\.yaml|package-lock\.json|.*\.lock|node_modules/.*|dist/.*|coverage/.*)' \
              . > .secrets.baseline.new
            # Fail if any secrets are found in a fresh scan
            if grep -q '"is_secret": true' .secrets.baseline.new 2>/dev/null || \
               python -c "import json,sys; d=json.load(open('.secrets.baseline.new')); sys.exit(0 if any(d.get('results',{}).values()) else 1)"; then
              echo "::error::Secrets detected! Review the scan output above."
              echo "If these are false positives, generate a baseline locally:"
              echo "  detect-secrets scan --exclude-files '...' . > .secrets.baseline"
              echo "  detect-secrets audit .secrets.baseline"
              cat .secrets.baseline.new
              exit 1
            fi
            rm -f .secrets.baseline.new
          fi

      - name: Verify baseline is up-to-date
        run: |
          if [ -f .secrets.baseline ]; then
            # Re-scan and compare – fails if new secrets were added without
            # updating the baseline.
            detect-secrets scan \
              --baseline .secrets.baseline \
              --exclude-files '(pnpm-lock\.yaml|package-lock\.json|.*\.lock|node_modules/.*|dist/.*|coverage/.*)' \
              .
          fi

  # ── gitleaks ──────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (push)
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for orgs > 25 users
        continue-on-error: true

      - name: Run gitleaks (pull_request)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  # ── .env file guard ───────────────────────────────────────────────────────
  env-guard:
    name: Prevent .env file commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .env files in changed files
        run: |
          # Get list of files changed in this PR / push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi

          # Match any .env file that is NOT .env.example
          VIOLATIONS=$(echo "$FILES" | grep -E '(^|/)\.env($|\.local$|\.development$|\.production$|\.staging$)' || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::The following .env files should NOT be committed:"
            echo "$VIOLATIONS"
            echo ""
            echo "Only .env.example files (with placeholder values) are allowed."
            echo "Store real secrets in GitHub Secrets or a vault."
            exit 1
          fi

          echo "No .env files found in changed files. ✓"
