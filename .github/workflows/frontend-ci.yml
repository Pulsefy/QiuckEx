name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  i18n-parity:
    name: i18n Key Parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build when any frontend locale is missing a key present in the
      # base locale (en) or contains a dead key absent from the base locale.
      - name: Check frontend i18n key parity
        run: node scripts/check-i18n-parity.mjs

      # Same invariant, enforced as a unit test for fast local feedback.
      - name: Run i18n parity unit test
        run: npx vitest run __tests__/i18n-parity.test.ts

  lint-and-type-check:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      # app/frontend installs with npm while the rest of the repo uses the pnpm
      # workspace. Catch npm-incompatible specifiers (notably "workspace:*")
      # here, with an actionable message, instead of letting npm ci fail with
      # EUNSUPPORTEDPROTOCOL.
      - name: Validate frontend dependency specifiers
        run: node scripts/check-frontend-deps.mjs

      - name: Install api-client dependencies
        working-directory: ./packages/api-client
        run: npm install --no-package-lock

      - name: Install dependencies
        working-directory: ./app/frontend
        run: npm ci

      - name: Reject frontend mock data modules
        run: |
          if find app/frontend/src -type f \( -name 'mockData.ts' -o -name 'mockApi.ts' \) -print -quit | grep -q .; then
            echo "Frontend mock data modules are not allowed under app/frontend/src."
            exit 1
          fi

      - name: Run ESLint
        working-directory: ./app/frontend
        run: npx eslint . --max-warnings 0

      - name: Run TypeScript type check
        working-directory: ./app/frontend
        run: npx tsc --noEmit

      - name: Run Unit Tests
        working-directory: ./app/frontend
        run: npm test || npx vitest run

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install api-client dependencies
        working-directory: ./packages/api-client
        run: npm install --no-package-lock

      - name: Install dependencies
        working-directory: ./app/frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./app/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_QUICKEX_API_URL: ${{ secrets.NEXT_PUBLIC_QUICKEX_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK }}
          NEXT_PUBLIC_ERROR_REPORTING_ENABLED: ${{ secrets.NEXT_PUBLIC_ERROR_REPORTING_ENABLED }}
          NEXT_PUBLIC_APP_VERSION: ${{ secrets.NEXT_PUBLIC_APP_VERSION }}

      # FE-65: measure per-route first-load JS and fail if a route exceeds its
      # budget (plus tolerance). See docs/FRONTEND-PERFORMANCE.md.
      - name: Enforce bundle-size budgets
        run: node scripts/bundle-budget.mjs --dist app/frontend/.next --budgets app/frontend/bundle-budgets.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: ./app/frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # Only shipped code can cause mixed content, so test files are excluded:
      # a stub host in a vi.mock (e.g. "http://test.local") never reaches a
      # browser, and failing on it just teaches contributors to ignore the gate.
      - name: Check for mixed content
        run: |
          echo "Checking for hardcoded HTTP URLs in frontend code..."
          scan() {
            grep -rn "http://" app/frontend/src \
              --include="*.ts" --include="*.tsx" \
              --exclude="*.test.ts" --exclude="*.test.tsx" \
              --exclude="*.spec.ts" --exclude="*.spec.tsx" \
              --exclude-dir=node_modules \
              --exclude-dir=__tests__ --exclude-dir=__mocks__ \
              2>/dev/null | grep -v "http://localhost"
          }
          if scan > /dev/null 2>&1; then
            echo "❌ Found hardcoded HTTP URLs (non-localhost). This may cause mixed-content issues in production."
            scan
            exit 1
          else
            echo "✅ No problematic HTTP URLs found"
          fi
