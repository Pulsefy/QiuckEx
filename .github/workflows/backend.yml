name: Backend CI.
on:
  push:
    branches: [main, develop]
    paths:
      - "app/backend/**"
  pull_request:
    branches: [main, develop]
    paths: 
      - "app/backend/**"
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_test:ci_test_password@localhost:5432/quickex_test
      SEED: 42
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRE_USER: ci_test
          POSTGRE_PASSWORD: ci_test_password
          POSTGRE_DB: quickex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pgisready -U ci_test -d quickex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Run integration tests
        run: pnpm run test:e2e