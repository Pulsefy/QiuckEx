name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/backend/**"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: quickex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # ── Database migrations ──────────────────────────────────────────────
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://ci_test:ci_test_password@localhost:5432/quickex_test
        run: |
          echo "🗄️  Running migrations against PostgreSQL..."
          bash scripts/run-ci-migrations.sh

      - name: Validate migration schema
        env:
          DATABASE_URL: postgresql://ci_test:ci_test_password@localhost:5432/quickex_test
        run: |
          echo "🔍 Validating schema after migrations..."
          EXPECTED_TABLES=$(find supabase/migrations -name '*.sql' -exec grep -h 'CREATE TABLE' {} \; | \
            sed 's/.*CREATE TABLE.*IF NOT EXISTS *//; s/CREATE TABLE *//; s/ *(.*//; s/^public\.//' | \
            sort -u | wc -l)
          ACTUAL_TABLES=$(psql "$DATABASE_URL" -t -A -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")
          echo "  Expected tables (from migrations): ~$EXPECTED_TABLES"
          echo "  Actual tables in database:          $ACTUAL_TABLES"
          if [ "$ACTUAL_TABLES" -lt 1 ]; then
            echo "❌ No tables found in the database — migrations may have failed silently."
            exit 1
          fi
          echo "✅ Schema validation passed."

      # ── Tests ────────────────────────────────────────────────────────────
      # Tests are run separately to avoid CI failures during development
      # Uncomment when tests are stable
      # - name: Run Unit Tests
      #   run: pnpm run test:unit
      #   env:
      #     NODE_ENV: test
      #     STELLAR_NETWORK: testnet
      #     SUPABASE_URL: https://test.supabase.co
      #     SUPABASE_ANON_KEY: test-key

      - name: Run Unit Tests with Coverage
        run: pnpm run test:unit:coverage
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Run Integration Tests with Coverage
        run: pnpm run test:int:coverage
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key
          DATABASE_URL: postgresql://ci_test:ci_test_password@localhost:5432/quickex_test

      # ── OpenAPI Spec Completeness Gate ──────────────────────────────────
      - name: Generate OpenAPI spec and run completeness gate
        run: pnpm run openapi:generate
        env:
          NODE_ENV: test
          NETWORK: testnet
          SUPABASE_URL: https://test-project.supabase.co
          SUPABASE_ANON_KEY: test-anon-key-for-testing
          PORT: 4000

      - name: Publish OpenAPI spec as CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-spec
          path: app/backend/dist-openapi/openapi.json
          retention-days: 30
