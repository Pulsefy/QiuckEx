name: Mobile E2E Scan-to-Pay

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  maestro-tests:
    name: Maestro Scan-to-Pay E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHU_PATH

      - name: Build Android debug APK
        working-directory: app/mobile/android
        run: ./gradlew :app:assembleDebug

      - name: Run Android emulator and Maestro test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            adb install app/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            MAESTRO_OUTPUT_DIR="$GITHUB_WORKSPACE/maestro-artifacts" maestro test app/mobile/.maestro/scan-to-pay.yaml

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-scan-to-pay-artifacts
          path: maestro-artifacts